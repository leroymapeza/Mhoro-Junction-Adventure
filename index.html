  const p=document.createElement('div');
  p.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;'+
   'padding:env(safe-area-inset-top) env(safe-area-inset-right) '+
   'env(safe-area-inset-bottom) env(safe-area-inset-left);';
  document.body.appendChild(p);
  const cs=getComputedStyle(p);
  safeT=parseFloat(cs.paddingTop)||0;safeR=parseFloat(cs.paddingRight)||0;
  safeB=parseFloat(cs.paddingBottom)||0;safeL=parseFloat(cs.paddingLeft)||0;
  document.body.removeChild(p);
}

function resize(){
  measureSafe();

  cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  cv.style.left=(v.x+(v.w-W*s)/2)+'px';

function parseOps(s){const o=[];s.trim().split('\n').forEach(l=>{const p=l.trim().split(/\s+/);if(p[0])o.push(p)});return o}
function buildLevel(i){
 const L=LEVELS[i],w=L.w,t=new Uint8Array(w*ROWS),fruits=[],foes=[],checks=[];
 let start={x:3*TILE+5,y:11*TILE},gong={x:(w-5)*TILE,y:11*TILE};
 const set=(x,r,v)=>{if(x>=0&&x<w&&r>=0&&r<ROWS)t[r*w+x]=v};
 parseOps(L.ops).forEach(op=>{
  const c=op[0],a=+op[1],b=+op[2],d=+op[3];
  if(c=='T')start={x:a*TILE+5,y:11*TILE};
  else if(c=='G')for(let x=a;x<=b;x++){set(x,12,1);set(x,13,1)}
  else if(c=='W')for(let x=a;x<=b;x++){set(x,12,5);set(x,13,5)}
  else if(c=='P')for(let x=a;x<=b;x++)set(x,d,2)
  else if(c=='R')for(let x=a;x<=b;x++)set(x,d,1)
  else if(c=='X')set(a,11,3)
  else if(c=='!')set(a,11,6)
  else if(c=='S')set(a,op[2]?b:11,4)
  else if(c=='F')fruits.push({x:a*TILE+TILE/2,y:b*TILE+TILE/2,v:1,m:0,ph:Math.random()*7})
  else if(c=='M')fruits.push({x:a*TILE+TILE/2,y:b*TILE+TILE/2,v:1,m:1,ph:Math.random()*7})
  else if(c=='g')foes.push({hx:a*TILE,x:a*TILE,y:11*TILE+6,r:b*TILE,dir:1,st:'walk',t:Math.random()*9,rot:0,vy:0,type:'gudo'})
  else if(c=='n')foes.push({hx:a*TILE,x:a*TILE,y:11*TILE+6,r:b*TILE,dir:1,st:'walk',t:Math.random()*9,rot:0,vy:0,type:'nyoka'})
  else if(c=='C')checks.push({x:a*TILE+TILE/2,y:11*TILE,on:false})
  else if(c=='E')gong={x:a*TILE,y:11*TILE}
 });
 return {L,t,w,fruits,foes,checks,start,gong,total:fruits.reduce((s,f)=>s+(f.m?3:1),0)};
}

const cstars=Array.from({length:90},(_,i)=>({x:(i*173)%W,y:(i*97)%320,s:1+((i*7)%3)/2,ph:i}));
const CFLAG=['#3f9e3f','#ffd23f','#e33d3d','#222','#fff'];

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();ac()});
addEventListener('keyup',e=>keys[e.code]=0);
let vkeys={l:0,r:0,j:0};
function toGame(a,b){const r=cv.getBoundingClientRect();return{x:(a-r.left)/SC,y:(b-r.top)/SC}}
function updTouch(e){vkeys={l:0,r:0,j:0};
 for(const t of e.touches){const g=toGame(t.clientX,t.clientY);
  for(const k in tbtns){const b=tbtns[k];
   if(g.x>=b.x-12&&g.x<=b.x+b.w+12&&g.y>=b.y-12&&g.y<=b.y+b.h+12)vkeys[k]=1}}}
let ts=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();ac();updTouch(e);
 const t=e.changedTouches[0];ts={g:toGame(t.clientX,t.clientY),t:performance.now()}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();updTouch(e)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();updTouch(e);
 if(ts){const t=e.changedTouches[0],g=toGame(t.clientX,t.clientY);
  if(performance.now()-ts.t<260&&Math.hypot(g.x-ts.g.x,g.y-ts.g.y)<26)tap(g.x,g.y);ts=null}},{passive:false});
cv.addEventListener('mousedown',e=>{ac();const g=toGame(e.clientX,e.clientY);tap(g.x,g.y)});
function inR(x,y,b){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h}

/* ---------- fx ---------- */
function part(o){P.push(Object.assign({vx:0,vy:0,g:0,life:.6,type:'dust',size:3,col:'#fff'},o))}
function partS(o){PS.push(Object.assign({vx:0,vy:60,g:0,life:2,type:'conf',size:5,col:'#ffd23f',rot:Math.random()*7,vr:(Math.random()-.5)*8},o))}
function burst(x,y,n,col,sp,type){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*sp;
 part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,g:300,life:.4+Math.random()*.4,col,type:type||'dust',size:2+Math.random()*3})}}
function toast(x,y,txt){toasts.push({x,y,txt,t:0})}
function confetti(){for(let i=0;i<130;i++)partS({x:Math.random()*W,y:-20-Math.random()*260,
 vy:70+Math.random()*130,vx:(Math.random()-.5)*60,col:CFLAG[i%5],size:4+Math.random()*5,life:4})}

/* ---------- flow ---------- */
function startLevel(i){
 selLevel=i;cur=buildLevel(i);
 p={x:cur.start.x,y:cur.start.y,vx:0,vy:0,w:28,h:26,onG:false,face:1,sq:1,inv:0,jbuf:0,coy:0,air:1,dust:0,celeb:false};
 checkPt={x:cur.start.x,y:cur.start.y};
 camX=Math.max(0,p.x-W*.4);got=0;winT=-1;banner=2.4;shake=0;
 P.length=0;toasts.length=0;sprA.length=0;fireflies.length=0;trailFx.length=0;mode='play';
 if(isTouch)goFullscreen();
}
function splashBack(){
 if(winT>=0)return;
 burst(p.x+p.w/2,p.y+p.h/2,20,'#5db9ff',200);
 shake=10;SFX.ouch();
 p.x=checkPt.x;p.y=checkPt.y-4;p.vx=0;p.vy=0;p.inv=1.8;p.air=1;
 toast(p.x,p.y-30,'Splash! Edza zvakare!');
}
function bump(fx,type){
 if(p.inv>0||winT>=0)return;
 p.inv=1.4;
 if(type=='nyoka'){SFX.hiss();toast(p.x,p.y-26,'Nyoka!')}
 else{SFX.ouch();toast(p.x,p.y-26,'Oya!')}
 shake=6;
 const dir=(p.x+p.w/2)<fx?-1:1;
 p.vx=dir*330;p.vy=-380;
 burst(p.x+p.w/2,p.y+p.h/2,12,type=='nyoka'?'#7fbe6f':'#ffb057',170);
}
function startWin(){
 if(winT>=0)return;winT=0;p.celeb=true;SFX.gong();shake=8;confetti();
 const r=got/cur.total;starsEarn=1+(r>=.5?1:0)+(r>=.98?1:0);
 if(starsEarn>save.stars[selLevel]){save.stars[selLevel]=starsEarn;persist()}
 setTimeout(()=>SFX.win(),400);
}

/* ---------- tiles ---------- */
function tAt(px,py){if(!cur)return 0;if(px<0||px>=cur.w*TILE)return 1;
 const c=Math.floor(px/TILE),r=Math.floor(py/TILE);
 if(r<0)return 0;if(r>=ROWS)return 1;return cur.t[r*cur.w+c]}
const isSolid=v=>v==1,isPlat=v=>v==2;
function floorY(x,y){
 const c=Math.floor(x/TILE);if(c<0||c>=cur.w)return -1;
 for(let r=Math.max(0,Math.floor(y/TILE));r<ROWS;r++){
  const v=cur.t[r*cur.w+c];if(v==1||v==2)return r*TILE}
 return -1;
}

/* ---------- update ---------- */
function updatePlay(dt){
 time+=dt;banner-=dt;
 const baby=save.baby;
 const kl=keys.ArrowLeft||keys.KeyA||vkeys.l,kr=keys.ArrowRight||keys.KeyD||vkeys.r,
       kj=keys.Space||keys.ArrowUp||keys.KeyW||vkeys.j;
 if(!p.celeb){
  const acc=2400*(baby==0?1.3:1),max=275*(baby==0?1.3:1);
  if(kl){p.vx-=acc*dt;p.face=-1}
  if(kr){p.vx+=acc*dt;p.face=1}
  if(!kl&&!kr)p.vx*=Math.max(0,1-9*dt);
  p.vx=Math.max(-max,Math.min(max,p.vx));
  if(kj&&!updatePlay.pj)p.jbuf=.14;updatePlay.pj=kj;
  p.jbuf-=dt;p.coy=p.onG?.12:p.coy-dt;
  if(p.jbuf>0){
   if(p.onG||p.coy>0){
    p.vy=-800*(baby==1?1.14:1);p.jbuf=0;p.coy=0;p.sq=1.22;p.air=1;
    burst(p.x+p.w/2,p.y+p.h,8,'#e8d9b8',90);SFX.jump();
   }else if(p.air>0){
    p.air--;p.vy=-720;p.jbuf=0;p.sq=1.25;
    burst(p.x+p.w/2,p.y+p.h,14,'#8fd3ff',180,'star');SFX.air();
    toast(p.x+p.w/2,p.y-16,'Hop!');
   }
  }
  if(!kj&&p.vy<-340)p.vy=-340;
  p.vy+=GRAV*(baby==2&&kj&&p.vy>0?.32:1)*dt;
  if(p.vy>920)p.vy=920;
 }else{p.vx*=.9;p.vy+=GRAV*dt}
 if(Math.abs(p.vx)>200&&Math.random()<.4)
  trailFx.push({x:p.x+p.w/2,y:p.y+p.h/2,t:.3,col:BABIES[baby].fur});
 p.x+=p.vx*dt;
 if(p.vx>0&&(isSolid(tAt(p.x+p.w,p.y+3))||isSolid(tAt(p.x+p.w,p.y+p.h-3)))){
   p.x=Math.floor((p.x+p.w)/TILE)*TILE-p.w-.01;p.vx=0}
 else if(p.vx<0&&(isSolid(tAt(p.x,p.y+3))||isSolid(tAt(p.x,p.y+p.h-3)))){
   p.x=(Math.floor(p.x/TILE)+1)*TILE+.01;p.vx=0}
 p.x=Math.max(0,Math.min(cur.w*TILE-p.w,p.x));
 const prevB=p.y+p.h;
 p.y+=p.vy*dt;p.onG=false;
 if(p.vy>=0){
  const fy=p.y+p.h,r=Math.floor(fy/TILE),top=r*TILE;
  if(isSolid(tAt(p.x+4,fy))||isSolid(tAt(p.x+p.w-4,fy))){
    if(!p.onGLand&&p.vy>380){burst(p.x+p.w/2,fy,6,'#e8d9b8',70);SFX.land();
     if(p.vy>700)SFX.swoop();p.sq=.8}
    p.y=top-p.h;p.vy=0;p.onG=true}
  else if((isPlat(tAt(p.x+4,fy))||isPlat(tAt(p.x+p.w-4,fy)))&&prevB<=top+7){
    p.y=top-p.h;p.vy=0;p.onG=true}
 }else if(isSolid(tAt(p.x+4,p.y))||isSolid(tAt(p.x+p.w-4,p.y))){
  p.y=(Math.floor(p.y/TILE)+1)*TILE;p.vy=0}
 if(p.onG)p.air=1;
 p.onGLand=p.onG;
 p.sq+=(1-p.sq)*Math.min(1,dt*10);
 p.inv-=dt;
 p.dust-=dt;
 if(p.onG&&Math.abs(p.vx)>140&&p.dust<=0){p.dust=.09;
   part({x:p.x+p.w/2-p.face*10,y:p.y+p.h,vx:-p.face*40,vy:-30,life:.4,col:'rgba(230,215,180,.8)',size:4})}
 const cxp=p.x+p.w/2,fy=p.y+p.h;
 [[cxp,fy-4],[p.x+4,fy-4],[p.x+p.w-4,fy-4]].forEach(pt=>{
   const v=tAt(pt[0],pt[1]);
   if(v==4&&p.vy>=-30){p.vy=-1020;p.sq=1.3;p.air=1;SFX.spring();shake=3;
     sprA.push({x:Math.floor(pt[0]/TILE),y:Math.floor(pt[1]/TILE),t:0});
     burst(cxp,fy,14,'#ffd23f',220,'spark');toast(cxp,fy-40,'Boing!')}
   if(v==3)bump(pt[0],'cactus');
   if(v==5&&fy>12*TILE)splashBack();
 });
 if(p.y>H+80||p.y>ROWS*TILE+120)splashBack();
 cur.fruits.forEach(f=>{
  if(!f.v)return;
  const dx=p.x+p.w/2-f.x,dy=p.y+p.h/2-f.y,d=Math.hypot(dx,dy);
  if(baby==3&&d<130&&d>1){f.x+=dx/d*260*dt;f.y+=dy/d*260*dt}
  if(d<30){f.v=0;got+=f.m?3:1;
   burst(f.x,f.y,f.m?18:10,f.m?'#ffe35e':'#ff8a4d',160,'spark');
   toast(f.x,f.y-14,f.m?'+3!':'+1');f.m?SFX.star():SFX.fruit()}
 });
 cur.checks.forEach(c=>{
  if(!c.on&&Math.abs(p.x+p.w/2-c.x)<26){c.on=true;checkPt={x:c.x-p.w/2,y:c.y-6};
   SFX.check();burst(c.x,c.y-40,16,'#7fe07f',150,'spark');toast(c.x,c.y-70,'Dare!')}
 });
 cur.foes.forEach(f=>{
  f.t+=dt;
  const spd=f.type=='nyoka'?65:48;
  if(f.st=='walk'){
   f.x+=f.dir*spd*dt;
   const ahead=f.x+f.dir*20;
   if(f.x<f.hx-f.r||f.x>f.hx+f.r||isSolid(tAt(ahead,f.y))||!isSolid(tAt(ahead,f.y+40)))f.dir*=-1;
  }else if(f.st=='fly'){
   f.vy+=GRAV*dt;f.y+=f.vy*dt;f.rot+=12*dt*f.dir;
   if(f.t>1.3){f.x=f.hx;f.y=11*TILE+6;f.st='dizzy';f.t=0}
  }else if(f.st=='dizzy'&&f.t>2.4){f.st='walk';f.rot=0}
  if(f.st=='walk'||f.st=='dizzy'){
   if(p.x<f.x+16&&p.x+p.w>f.x-16&&p.y<f.y+30&&p.y+p.h>f.y-6){
    if(p.vy>120&&(p.y+p.h)-f.y<22){
     f.st='fly';f.vy=-640;f.t=0;p.vy=-520;p.sq=1.2;p.air=1;
     burst(f.x,f.y,14,'#ffe35e',200,'star');SFX.stomp();
     if(f.type=='nyoka')SFX.hiss();
     shake=4;
    }else bump(f.x,f.type);
   }
  }
 });
 const g=cur.gong;
 if(winT<0&&Math.abs(p.x+p.w/2-(g.x+28))<40&&p.y>g.y-120)startWin();
 if(winT>=0){winT+=dt;if(winT>1.1&&mode=='play')mode='win'}
 const tgt=Math.max(0,Math.min(cur.w*TILE-W,p.x-W*.42));
 camX+=(tgt-camX)*Math.min(1,dt*6);
 shake=Math.max(0,shake-dt*30);
 stepFx(dt);
}
function stepFx(dt){
 for(let i=P.length-1;i>=0;i--){const q=P[i];q.life-=dt;
  q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.life<=0)P.splice(i,1)}
 for(let i=PS.length-1;i>=0;i--){const q=PS[i];q.life-=dt;
  q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;if(q.life<=0||q.y>H+40)PS.splice(i,1)}
 for(let i=toasts.length-1;i>=0;i--){const t=toasts[i];t.t+=dt;t.y-=34*dt;if(t.t>1.1)toasts.splice(i,1)}
 for(let i=sprA.length-1;i>=0;i--){sprA[i].t+=dt;if(sprA[i].t>.3)sprA.splice(i,1)}
 for(let i=fireflies.length-1;i>=0;i--){const f=fireflies[i];f.t+=dt;f.x+=f.vx*dt;f.y+=Math.sin(f.t*2)*20*dt;
  if(f.t>f.life)fireflies.splice(i,1)}
 for(let i=trailFx.length-1;i>=0;i--){trailFx[i].t-=dt;if(trailFx[i].t<=0)trailFx.splice(i,1)}
 if(cur){const z=cur.L.zone,amb=ZONES[z].ambient;
  if(amb=='firefly'&&Math.random()<dt*3)
   fireflies.push({x:camX+Math.random()*W,y:150+Math.random()*200,vx:(Math.random()-.5)*30,life:8,t:0});
  if(amb=='pollen'&&Math.random()<dt*2)
   part({x:camX+W+20,y:80+Math.random()*300,vx:-20-Math.random()*20,vy:10+Math.random()*10,life:8,col:'rgba(255,240,180,.6)',size:2,type:'seed'});
  if(amb=='dust'&&Math.random()<dt*1.5)
   part({x:camX+W+20,y:100+Math.random()*260,vx:-60-Math.random()*60,vy:10,life:6,col:'#9a7f3f',size:3,type:'leaf'});
  if(amb=='ember'&&Math.random()<dt*2)
   part({x:camX+Math.random()*W,y:H,vx:(Math.random()-.5)*20,vy:-40-Math.random()*40,life:3,col:'rgba(255,140,50,.7)',size:2.5,type:'spark'});
  if(amb=='mist'&&Math.random()<dt*1)
   part({x:camX+Math.random()*W,y:300+Math.random()*150,vx:(Math.random()-.5)*10,vy:-5,life:4,col:'rgba(200,240,255,.3)',size:8,type:'dust'});
  if(z==4&&Math.random()<dt*8)
   part({x:camX+Math.random()*W,y:Math.random()*300,vy:-8,life:1.6,col:'#8ff0e8',size:2,type:'spark'});
 }
}

/* ---------- draw helpers ---------- */
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);
 cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function starPath(x,y,r,rot){cx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,
 q=i%2?r*.45:r;cx[i?'lineTo':'moveTo'](x+Math.cos(a)*q,y+Math.sin(a)*q)}cx.closePath()}
function txt(s,x,y,size,col,align,wt){cx.fillStyle=col;cx.textAlign=align||'center';
 cx.font=(wt||'700')+' '+size+'px Fredoka, "Comic Sans MS", system-ui, sans-serif';cx.fillText(s,x,y)}
function btxt(s,x,y,size,col,align,wt){cx.font=(wt||'900')+' '+size+'px Fredoka, "Comic Sans MS", system-ui, sans-serif';
 cx.textAlign=align||'center';cx.lineJoin='round';cx.lineWidth=Math.max(3,size*.18);
 cx.strokeStyle='rgba(42,23,8,.95)';cx.strokeText(s,x,y);cx.fillStyle=col;cx.fillText(s,x,y)}
function panel(x,y,w,h){cx.fillStyle='#8a5a2a';rr(x,y,w,h,h/2);cx.fill();
 cx.strokeStyle='#4a2a12';cx.lineWidth=3;cx.stroke();
 cx.fillStyle='rgba(255,255,255,.15)';rr(x+3,y+3,w-6,h*.45,h/4);cx.fill()}
function glow(x,y,r,col){const g=cx.createRadialGradient(x,y,1,x,y,r);
 g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');
 cx.fillStyle=g;cx.fillRect(x-r,y-r,r*2,r*2)}
function vignette(a){const g=cx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.85);
 g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+a+')');
 cx.fillStyle=g;cx.fillRect(0,0,W,H)}
const OL=()=>{cx.lineWidth=3;cx.strokeStyle=C.ink;cx.lineJoin='round';cx.lineCap='round'};

/* ---------- characters ---------- */
function drawBaby(x,y,i,o){
 o=o||{};const b=BABIES[i],t=o.t||time,face=o.face||1,sq=o.sq||1,run=o.run,air=!o.onG;
 cx.save();cx.translate(x,y);cx.scale(face*(1+(1-sq)*.7),sq);OL();
 const step=run?Math.sin(t*16):0;
 cx.fillStyle=b.dark;cx.beginPath();cx.ellipse(-16,1,4,3.4,0,0,7);cx.fill();cx.stroke();
 if(air){cx.beginPath();cx.ellipse(-7,10,5,4,0,0,7);cx.fill();cx.stroke();
  cx.beginPath();cx.ellipse(7,10,5,4,0,0,7);cx.fill();cx.stroke()}
 else{cx.beginPath();cx.ellipse(-7+step*3,12,5.5,3.8,0,0,7);cx.fill();cx.stroke();
  cx.beginPath();cx.ellipse(7-step*3,12,5.5,3.8,0,0,7);cx.fill();cx.stroke()}
 cx.fillStyle=b.fur;cx.beginPath();cx.ellipse(0,0,17,14,0,0,7);cx.fill();cx.stroke();
 cx.fillStyle=b.belly;cx.beginPath();cx.ellipse(4,5,9,8,0,0,7);cx.fill();
 cx.fillStyle=b.dark;cx.beginPath();cx.ellipse(-3,-9,6,3.4,-.2,0,7);cx.fill();
 const wig=Math.sin(t*3+i)*.15;
 cx.fillStyle=b.fur;
 cx.beginPath();cx.ellipse(-7,-13,4.4,5,wig,0,7);cx.fill();cx.stroke();
 cx.beginPath();cx.ellipse(5,-13,4.4,5,-wig,0,7);cx.fill();cx.stroke();
 cx.fillStyle=b.dark;
 cx.beginPath();cx.ellipse(-7,-12,2,2.6,wig,0,7);cx.fill();
 cx.beginPath();cx.ellipse(5,-12,2,2.6,-wig,0,7);cx.fill();
 cx.fillStyle=b.scarf;rr(-13,5,26,6,3);cx.fill();cx.stroke();
 cx.save();cx.translate(-12,7);cx.rotate(Math.sin(t*6)*.3+.4);rr(-3,0,7,13,3);cx.fill();cx.stroke();cx.restore();
 const blink=Math.sin(t*1.7+i*3)>.98?.15:1;
 cx.fillStyle='#fff';cx.beginPath();cx.arc(7,-5,5,0,7);cx.fill();cx.stroke();
 cx.beginPath();cx.arc(14.5,-4,4.2,0,7);cx.fill();cx.stroke();
 cx.fillStyle='#2A1B12';
 cx.beginPath();cx.arc(8.2,-4.6,2.4*blink,0,7);cx.fill();
 cx.beginPath();cx.arc(15.4,-3.8,2*blink,0,7);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.arc(9,-5.6,.9,0,7);cx.fill();
 cx.fillStyle=C.ink;cx.beginPath();cx.arc(18,-1,2.4,0,7);cx.fill();
 cx.strokeStyle=C.ink;cx.lineWidth=2;cx.beginPath();cx.arc(15,2,3.4,.2,Math.PI-.6);cx.stroke();
 cx.fillStyle='rgba(242,126,107,.5)';cx.beginPath();cx.arc(10,1,2.8,0,7);cx.fill();
 cx.restore();
}
function drawGudo(f){
 const sx=f.x-camX;if(sx<-60||sx>W+60)return;
 cx.save();cx.translate(sx,f.y+30);
 if(f.st=='fly')cx.rotate(f.rot);
 cx.scale(f.dir,1);OL();
 const bob=f.st=='walk'?Math.abs(Math.sin(f.t*10))*3:0;
 cx.translate(0,-bob);
 cx.strokeStyle='#6b4f3d';cx.lineWidth=5;
 cx.beginPath();cx.moveTo(-14,-6);cx.quadraticCurveTo(-26,-18,-20,-30);cx.stroke();
 cx.fillStyle='#8a6a55';cx.beginPath();cx.ellipse(0,-12,16,13,0,0,7);cx.fill();cx.stroke();
 cx.fillStyle='#a88a70';cx.beginPath();cx.ellipse(2,-8,10,7,0,0,7);cx.fill();
 cx.fillStyle='#8a6a55';cx.beginPath();cx.arc(12,-22,10,0,7);cx.fill();cx.stroke();
 cx.fillStyle='#c9a888';cx.beginPath();cx.ellipse(18,-20,7,5,0,0,7);cx.fill();
 cx.fillStyle='#5a4030';cx.beginPath();cx.arc(13,-26,4,0,7);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.arc(14,-24,2.6,0,7);cx.fill();
 cx.fillStyle='#241505';
 if(f.st=='dizzy'){cx.lineWidth=1.6;cx.strokeStyle='#241505';

 for(let i=0;i<4;i++){

   rr(x,130,185,290,18);cx.stroke();cx.shadowBlur=0}
  else{cx.strokeStyle='#8a5a2a';cx.lineWidth=3;rr(x,130,185,290,18);cx.stroke()}
  drawBaby(x+92,225+Math.sin(time*3+i)*5,i,{t:time+i,onG:false});

 panel(20,16,90,36);btxt('◀ Map',65,40,16,'#fff');
 cx.fillStyle='#3fae5a';rr(W/2-90,H-70,180,48,24);cx.fill();
 cx.strokeStyle=C.ink;cx.lineWidth=3;cx.stroke();
 btxt('TANGAI! ▶',W/2,H-38,22,'#fff');

function drawTitle(){
 drawMapBG();
 cx.fillStyle='#1c0f2e';
 [[810,H-20,1.8],[120,H-10,1.3]].forEach(tr=>{

 btxt('J U N C T I O N',W/2,222,40,'#fff');
 cx.fillStyle='#3fae5a';rr(W/2-190,244,380,34,17);cx.fill();
 cx.strokeStyle=C.ink;cx.lineWidth=3;cx.stroke();
 btxt('★  BABY HYRAX ADVENTURE  ★',W/2,268,18,'#fff');
 for(let i=0;i<4;i++){

 cx.globalAlpha=.6+Math.sin(time*4)*.4;

/* ---------- routing ---------- */
function tap(x,y){
 ac();
 if(pending)return;
 if(mode=='title'){SFX.tap();go('map')}
 else if(mode=='map'){
  if(inR(x,y,{x:W-186,y:12,w:176,h:44})){SFX.tap();go('select');return}
  NODES.forEach((n,i)=>{const ds=depthScale(i);
   if(Math.hypot(x-n.x,y-n.y)<36*ds&&unlocked(i)){SFX.tap();selLevel=i;go('tale')}});}
 else if(mode=='tale'){SFX.tap();startLevel(selLevel)}
 else if(mode=='select'){
  if(inR(x,y,{x:20,y:16,w:90,h:36})){SFX.tap();go('map');return}
  if(inR(x,y,{x:W/2-90,y:H-70,w:180,h:48})){SFX.tap();go('map');return}
  for(let i=0;i<4;i++)if(inR(x,y,{x:90+i*205,y:130,w:185,h:290})){
   save.baby=i;persist();SFX.fruit()}}
 else if(mode=='win'){if(winT>1.4){SFX.tap();go('map')}}
 else if(mode=='play'){if(inR(x,y,homeB)){SFX.tap();go('map')}}
}
function go(m){pending=m;transT=0}

/* ---------- loop ---------- */
let last=0;
function loop(ts){
 requestAnimationFrame(loop);
 const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;
 musicTick(dt);
 if(pending!==null){transT+=dt;
  if(transT>.22){mode=pending;pending=null;PS.length=0}}
 cx.clearRect(0,0,W,H);
 if(mode=='play'){updatePlay(dt);drawWorld();drawHUD()}
 else if(mode=='win'){time+=dt;winT+=dt;stepFx(dt);p.sq=1+Math.sin(time*8)*.08;drawWin()}
 else if(mode=='map'){time+=dt;stepFx(dt);drawMap()}
 else if(mode=='tale'){time+=dt;stepFx(dt);drawTale()}
 else if(mode=='select'){time+=dt;stepFx(dt);drawSelect()}
 else{time+=dt;stepFx(dt);drawTitle();
  if(Math.random()<.02)partS({x:Math.random()*W,y:-10,vy:60,col:'#ffd23f',size:4,life:5})}
 if(pending!==null){const a=Math.min(1,Math.min(transT,.44-transT)/.22);
  cx.fillStyle='rgba(18,10,6,'+Math.max(0,a)+')';cx.fillRect(0,0,W,H)}
}
requestAnimationFrame(loop);

/* ---------- offline (service worker) ---------- */
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
